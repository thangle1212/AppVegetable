# ? C?u hình Gradle t?i ?u cho RAM 16GB

# Gi? ti?n trình Gradle ch?y n?n ?? build nhanh h?n
org.gradle.daemon=true

# Cho phép build song song nhi?u module
org.gradle.parallel=true

# Ch? c?u hình nh?ng module c?n thi?t
org.gradle.configureondemand=true

# B?t caching ?? tái s? d?ng k?t qu? build c?
